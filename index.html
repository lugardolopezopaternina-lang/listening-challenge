<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benchmark Listening Challenge - 10 Exercises</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --selected: #f59e0b;
      --correct: #22c55e;
      --wrong: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container {
      background: var(--card);
      max-width: 820px;
      width: 100%;
      border-radius: 14px;
      padding: 24px 28px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .badge {
      background: #0284c7;
      color: #fff;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .exercise-grid {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      background: rgba(15, 23, 42, 0.5);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      align-items: center;
    }

    .grid-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-right: 6px;
      font-weight: 600;
    }

    .ex-chip {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #334155;
      color: #fff;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .ex-chip:hover {
      background: #475569;
    }

    .ex-chip.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    h1 {
      font-size: 1.4rem;
      color: var(--accent);
      margin-bottom: 6px;
    }

    p.instr {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .audio-box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    audio {
      width: 100%;
      height: 42px;
      outline: none;
    }

    .counter-bar {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
    }

    .counter {
      color: var(--selected);
      font-weight: 700;
    }

    .counter.full {
      color: var(--correct);
    }

    .script-box {
      background: #0b1120;
      padding: 24px;
      border-radius: 10px;
      border: 1px solid var(--border);
      line-height: 2.2;
      font-size: 1.05rem;
      margin-bottom: 20px;
      user-select: none;
    }

    .word {
      display: inline-block;
      padding: 2px 6px;
      margin: 1px 1px;
      border-radius: 6px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: background 0.15s;
    }

    .word:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .word.selected {
      background: rgba(245, 158, 11, 0.25);
      color: #fbbf24;
      border-bottom: 2px solid var(--selected);
      font-weight: 600;
    }

    .word.hit {
      background: rgba(34, 197, 94, 0.25) !important;
      color: #4ade80 !important;
      border-bottom: 2px solid var(--correct) !important;
      text-decoration: line-through;
    }

    .word.missed {
      border: 2px dashed var(--selected) !important;
      color: #fbbf24 !important;
      background: transparent !important;
    }

    .word.false-alarm {
      background: rgba(239, 68, 68, 0.2) !important;
      color: #f87171 !important;
      border-bottom: 2px solid var(--wrong) !important;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }

    .btn-check {
      background: var(--accent);
      color: #0f172a;
    }

    .btn-check:hover {
      background: var(--accent-hover);
    }

    .btn-nav {
      background: #334155;
      color: #fff;
    }

    .btn-nav:hover {
      background: #475569;
    }

    .btn-nav:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .results {
      display: none;
      padding: 18px;
      background: #0b1120;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .results.visible {
      display: block;
    }

    .diff-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.95rem;
    }

    .diff-table th, .diff-table td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }

    .diff-table th {
      color: var(--text-muted);
    }

    .td-wrong {
      color: #f87171;
      text-decoration: line-through;
      font-weight: 600;
    }

    .td-right {
      color: #4ade80;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="nav-header">
      <span class="badge" id="exerciseBadge">Exercise 1 of 10</span>
      <div style="display: flex; gap: 8px;">
        <button id="prevBtn" class="btn-nav" style="padding: 6px 14px; font-size: 0.85rem;" disabled>&larr; Anterior</button>
        <button id="nextBtn" class="btn-nav" style="padding: 6px 14px; font-size: 0.85rem;">Siguiente &rarr;</button>
      </div>
    </div>

    <div class="exercise-grid" id="chipsContainer">
      <span class="grid-label">Ejercicio:</span>
    </div>

    <h1 id="exerciseTitle">Exercise 1: Locked Out</h1>
    <p class="instr">Escucha el audio con atención. Haz clic sobre las <strong>5 palabras</strong> en el texto que sean diferentes a lo que dice la grabación.</p>

    <div class="audio-box">
      <audio id="player" controls></audio>
    </div>

    <div class="counter-bar">
      <span>Palabras seleccionadas:</span>
      <span id="counter" class="counter">0 / 5</span>
    </div>

    <div class="script-box" id="scriptBox"></div>

    <div class="actions">
      <button class="btn-check" id="checkBtn">Verificar respuestas</button>
      <button class="btn-nav" id="resetBtn">Reiniciar intento</button>
    </div>

    <div class="results" id="resultsBox">
      <h3 id="scoreText" style="margin-bottom: 8px;"></h3>
      <table class="diff-table">
        <thead>
          <tr>
            <th>Texto en pantalla</th>
            <th>Lo que dice el audio</th>
          </tr>
        </thead>
        <tbody id="diffBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const EXERCISES = [
      {
        title: "Exercise 1: Locked Out",
        audioSrc: "audio1.mp3",
        discrepancies: [
          { screen: "late", audio: "early" },
          { screen: "jacket", audio: "shirt" },
          { screen: "back", audio: "front" },
          { screen: "table", audio: "counter" },
          { screen: "shoes", audio: "socks" }
        ],
        text: "I really thought today would be different. I woke up {late}, made actual coffee instead of that terrible instant stuff, and even ironed my {jacket}. For once, I felt completely in control of my life. Then, I heard the heavy click of the {back} door shutting behind me, and my stomach dropped. My keys are sitting right there on the kitchen {table}, next to my phone and my wallet. Now I'm standing in the hallway in my {shoes}, listening to my phone ring inside an empty apartment. Sometimes I wonder if the universe is trying to tell me to stay in bed."
      },
      {
        title: "Exercise 2: Job Resume",
        audioSrc: "audio2.mp3",
        discrepancies: [
          { screen: "Spanish", audio: "French" },
          { screen: "five", audio: "three" },
          { screen: "sandwich", audio: "croissant" },
          { screen: "London", audio: "Paris" },
          { screen: "fast", audio: "hard" }
        ],
        text: "Please don't look at my resume too closely. Yes, it says I'm fluent in {Spanish}, and technically, I did pass an online course {five} years ago, so that isn't a complete lie. If you ask me to order a {sandwich}, I will absolutely shine. However, if you expect me to negotiate a corporate merger in {London}, we might run into a slight communication barrier. What I lack in vocabulary, though, I make up for in sheer panic-driven determination. Hire me, and I promise I will work twice as {fast} just to cover up the things I don't actually know yet."
      },
      {
        title: "Exercise 3: The Yellow Umbrella",
        audioSrc: "audio3.mp3",
        discrepancies: [
          { screen: "crowded", audio: "empty" },
          { screen: "red", audio: "yellow" },
          { screen: "town", audio: "city" },
          { screen: "hands", audio: "feet" },
          { screen: "silver", audio: "brass" }
        ],
        text: "The station platform was supposed to be {crowded} at midnight, yet there she was, holding a bright {red} umbrella under a completely clear sky. I told myself to look away and mind my own business, just like anyone living in this {town} would do. When the train finally pulled in, the lights inside the carriages flickered and died for a second. By the time they came back on, she was gone, but the yellow umbrella was lying right at my {hands}. Inside the handle, someone had taped a small {silver} key and a note with my own name on it."
      },
      {
        title: "Exercise 4: Difficult Goodbye",
        audioSrc: "audio4.mp3",
        discrepancies: [
          { screen: "weeks", audio: "months" },
          { screen: "busy", audio: "stressed" },
          { screen: "boxes", audio: "bags" },
          { screen: "sad", audio: "angry" },
          { screen: "slowly", audio: "quietly" }
        ],
        text: "You don't need to keep apologizing, because honestly, I saw this coming {weeks} ago. People don't just suddenly stop asking how your day went unless they've already checked out of the relationship. I kept making excuses for you—telling myself you were just {busy} with work or tired from the commute. The truth is, I was working overtime to keep us together while you were quietly packing your {boxes} in your head. I'm not even {sad} anymore; I'm just exhausted from trying to love someone who isn't really in the room. Take your things, and please, just close the door {slowly}."
      },
      {
        title: "Exercise 5: The Audition",
        audioSrc: "audio5.mp3",
        discrepancies: [
          { screen: "lawyer", audio: "accountant" },
          { screen: "cold", audio: "spicy" },
          { screen: "hair", audio: "glasses" },
          { screen: "chicken", audio: "seagull" },
          { screen: "shield", audio: "sword" }
        ],
        text: "Thank you so much for seeing me today! I know the casting call asked for a fierce, intimidating medieval warrior, and I realize I look more like an {lawyer} who gets nervous ordering {cold} food. However, acting is all about transformation, isn't it? If you just squint a little and ignore my {hair}, you can practically see the bloodthirsty rage behind my eyes. Wait, please don't write anything down yet! Let me show you my battle cry. Okay, maybe that sounded a bit like a startled {chicken}, but with proper lighting and a heavy {shield}, I'll be terrifying, I swear!"
      },
      {
        title: "Exercise 6: Time Capsule",
        audioSrc: "audio6.mp3",
        discrepancies: [
          { screen: "thirty", audio: "twenty" },
          { screen: "old", audio: "faded" },
          { screen: "history", audio: "math" },
          { screen: "movie", audio: "concert" },
          { screen: "phone", audio: "watch" }
        ],
        text: "We buried this rusty metal box in the backyard {thirty} years ago, convinced we would still be best friends when we dug it up. Looking at these {old} photographs and silly notes now, it feels like I'm reading about strangers. Back then, our biggest worry was passing {history} class and saving enough allowance to buy {movie} tickets. We promised we would never become boring adults who cared about mortgages and rush hour traffic, yet here I am, checking my {phone} before I even finish opening it. I wonder where you are today, and if you ever think about this afternoon."
      },
      {
        title: "Exercise 7: Family Secret",
        audioSrc: "audio7.mp3",
        discrepancies: [
          { screen: "vanilla", audio: "chocolate" },
          { screen: "wooden", audio: "locked" },
          { screen: "cup", audio: "egg" },
          { screen: "sugar", audio: "coffee" },
          { screen: "birthday", audio: "Christmas" }
        ],
        text: "Everyone in this family thinks my grandmother's famous {vanilla} cake is a hundred-year-old culinary masterpiece passed down through generations. Before she passed away, she made me swear I would protect the secret with my life, and finally handed me the {wooden} recipe box. Do you want to know what was inside? An empty cardboard box of supermarket cake mix and a sticky note that said, \"Just add an extra {cup} and a spoonful of instant {sugar}.\" I have been lying to my relatives every {birthday} for five years, and honestly, the guilt tastes almost as good as the frosting."
      },
      {
        title: "Exercise 8: The Whistleblower",
        audioSrc: "audio8.mp3",
        discrepancies: [
          { screen: "station", audio: "airport" },
          { screen: "Friday", audio: "Tuesday" },
          { screen: "hundreds", audio: "thousands" },
          { screen: "thirty", audio: "twenty" },
          { screen: "black", audio: "blue" }
        ],
        text: "If you are watching this video, it means I didn't make it to the {station} in time. For the past three years, I've been working in the accounting department at NexaCorp, and what I discovered last {Friday} goes way beyond simple tax evasion. They aren't just hiding money; they are covering up safety failures that could affect {hundreds} of people in this city. I tried taking the files to my supervisor, and {thirty} minutes later, my security badge was deactivated. Everything you need to prove what they've done is on the {black} flash drive taped underneath my desk drawer."
      },
      {
        title: "Exercise 9: Backpacking Reality",
        audioSrc: "audio9.mp3",
        discrepancies: [
          { screen: "Asia", audio: "Europe" },
          { screen: "wine", audio: "espresso" },
          { screen: "four", audio: "six" },
          { screen: "cheese", audio: "goat" },
          { screen: "legs", audio: "feet" }
        ],
        text: "Social media really lied to me about backpacking through {Asia}. In the photos, everyone looks effortless and glowing while sipping {wine} in quiet cobblestone alleys. Meanwhile, I have been carrying a forty-pound backpack up {four} flights of stairs because the hostel elevator has been broken since 1998. Yesterday, I accidentally boarded an express train going in the completely wrong direction and ended up in a tiny village where nobody speaks English, and the only restaurant was closed for a local {cheese} festival. My {legs} hurt, I'm broke, and yet, strangely enough, I don't think I want to go home."
      },
      {
        title: "Exercise 10: The Apology",
        audioSrc: "audio10.mp3",
        discrepancies: [
          { screen: "porch", audio: "doorstep" },
          { screen: "shut", audio: "slam" },
          { screen: "falling", audio: "failing" },
          { screen: "stupid", audio: "cowardly" },
          { screen: "hug", audio: "forgive" }
        ],
        text: "I know I'm the last person you want to see on your {porch} right now, and if you {shut} the door in my face, I completely deserve it. Back then, I was so terrified of {falling} that I chose to ruin everything before it had a chance to fall apart on its own. Walking away without an explanation was {stupid}, and it's the biggest regret of my life. I didn't come here expecting you to {hug} me right away, or even at all. I just needed you to know that you were never the problem—I was."
      }
    ];

    let currentIdx = 0;
    let selectedWords = new Set();
    let isChecked = false;

    const player = document.getElementById("player");
    const scriptBox = document.getElementById("scriptBox");
    const counterEl = document.getElementById("counter");
    const checkBtn = document.getElementById("checkBtn");
    const resetBtn = document.getElementById("resetBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const resultsBox = document.getElementById("resultsBox");
    const scoreText = document.getElementById("scoreText");
    const diffBody = document.getElementById("diffBody");
    const exerciseBadge = document.getElementById("exerciseBadge");
    const exerciseTitle = document.getElementById("exerciseTitle");
    const chipsContainer = document.getElementById("chipsContainer");

    function createChips() {
      chipsContainer.innerHTML = '<span class="grid-label">Ejercicio:</span>';
      EXERCISES.forEach((_, i) => {
        const btn = document.createElement("button");
        btn.className = "ex-chip";
        btn.textContent = i + 1;
        btn.title = `Ir al ejercicio ${i + 1}`;
        btn.addEventListener("click", () => loadExercise(i));
        chipsContainer.appendChild(btn);
      });
    }

    function updateActiveChip() {
      const chips = document.querySelectorAll(".ex-chip");
      chips.forEach((c, i) => {
        if (i === currentIdx) c.classList.add("active");
        else c.classList.remove("active");
      });
    }

    function loadExercise(index) {
      currentIdx = index;
      const data = EXERCISES[currentIdx];

      exerciseBadge.textContent = `Exercise ${currentIdx + 1} of ${EXERCISES.length}`;
      exerciseTitle.textContent = data.title;
      player.src = data.audioSrc;
      player.load();

      prevBtn.disabled = currentIdx === 0;
      nextBtn.disabled = currentIdx === EXERCISES.length - 1;

      updateActiveChip();
      resetState();
    }

    function resetState() {
      isChecked = false;
      resultsBox.classList.remove("visible");
      selectedWords.clear();
      updateCounter();
      renderScript();
    }

    function renderScript() {
      scriptBox.innerHTML = "";
      const rawText = EXERCISES[currentIdx].text;
      
      const tokens = rawText.match(/\{[\w'-]+\}|[A-Za-z0-9'-]+|[^\s\w]/g) || [];

      tokens.forEach((token, idx) => {
        let clean = token;
        let isTarget = false;

        if (token.startsWith("{") && token.endsWith("}")) {
          clean = token.slice(1, -1);
          isTarget = true;
        }

        if (/^[.,!?;:"'—–()]+$/.test(clean)) {
          scriptBox.appendChild(document.createTextNode(clean + (/[.,!?;:—–)]/.test(clean) ? " " : "")));
          return;
        }

        const span = document.createElement("span");
        span.className = "word";
        span.textContent = clean;
        span.dataset.word = clean.toLowerCase();
        if (isTarget) span.dataset.target = "true";

        span.addEventListener("click", () => toggleWord(span));
        scriptBox.appendChild(span);

        const nextToken = tokens[idx + 1];
        if (!nextToken || !/^[.,!?;:—–)]/.test(nextToken)) {
          scriptBox.appendChild(document.createTextNode(" "));
        }
      });
    }

    function toggleWord(el) {
      if (isChecked) return;

      if (selectedWords.has(el)) {
        selectedWords.delete(el);
        el.classList.remove("selected");
      } else {
        if (selectedWords.size >= 5) {
          alert("Ya seleccionaste 5 palabras. Haz clic sobre una de las marcadas para deseleccionarla si deseas cambiarla.");
          return;
        }
        selectedWords.add(el);
        el.classList.add("selected");
      }
      updateCounter();
    }

    function updateCounter() {
      const count = selectedWords.size;
      counterEl.textContent = `${count} / 5`;
      if (count === 5) counterEl.classList.add("full");
      else counterEl.classList.remove("full");
    }

    checkBtn.addEventListener("click", () => {
      if (isChecked) return;
      if (selectedWords.size === 0) {
        alert("Selecciona al menos una palabra antes de verificar.");
        return;
      }

      isChecked = true;
      let score = 0;
      const allWords = document.querySelectorAll(".word");

      allWords.forEach(el => {
        const isTarget = el.dataset.target === "true";
        const isSelected = selectedWords.has(el);

        if (isSelected && isTarget) {
          el.className = "word hit";
          score++;
        } else if (isSelected && !isTarget) {
          el.className = "word false-alarm";
        } else if (!isSelected && isTarget) {
          el.className = "word missed";
        }
      });

      resultsBox.classList.add("visible");
      scoreText.innerHTML = `Puntuación: <span style="color: ${score >= 4 ? '#4ade80' : '#f59e0b'}">${score} de 5 aciertos</span>`;
      
      diffBody.innerHTML = "";
      EXERCISES[currentIdx].discrepancies.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td class="td-wrong">${item.screen}</td><td class="td-right">${item.audio}</td>`;
        diffBody.appendChild(tr);
      });
    });

    resetBtn.addEventListener("click", resetState);
    prevBtn.addEventListener("click", () => { if (currentIdx > 0) loadExercise(currentIdx - 1); });
    nextBtn.addEventListener("click", () => { if (currentIdx < EXERCISES.length - 1) loadExercise(currentIdx + 1); });

    createChips();
    loadExercise(0);
  </script>
</body>
</html>
