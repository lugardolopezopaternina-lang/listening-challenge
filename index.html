<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listening Challenge - 10 Exercises</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --selected: #f59e0b;
      --correct: #22c55e;
      --wrong: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container {
      background: var(--card);
      max-width: 820px;
      width: 100%;
      border-radius: 14px;
      padding: 24px 28px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .badge {
      background: #0284c7;
      color: #fff;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .exercise-grid {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      background: rgba(15, 23, 42, 0.5);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      align-items: center;
    }

    .grid-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-right: 6px;
      font-weight: 600;
    }

    .ex-chip {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #334155;
      color: #fff;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .ex-chip:hover {
      background: #475569;
    }

    .ex-chip.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    h1 {
      font-size: 1.4rem;
      color: var(--accent);
      margin-bottom: 6px;
    }

    p.instr {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .audio-box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    audio {
      width: 100%;
      height: 42px;
      outline: none;
    }

    .counter-bar {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
    }

    .counter {
      color: var(--selected);
      font-weight: 700;
    }

    .counter.full {
      color: var(--correct);
    }

    .script-box {
      background: #0b1120;
      padding: 22px;
      border-radius: 10px;
      border: 1px solid var(--border);
      line-height: 2.2;
      font-size: 1.02rem;
      margin-bottom: 20px;
      user-select: none;
    }

    .dialogue-turn {
      margin-bottom: 12px;
    }

    .speaker {
      font-weight: 700;
      color: var(--accent);
      margin-right: 4px;
    }

    .word {
      display: inline-block;
      padding: 2px 6px;
      margin: 1px 2px;
      border-radius: 6px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: background 0.15s;
    }

    .word:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .word.selected {
      background: rgba(245, 158, 11, 0.25);
      color: #fbbf24;
      border-bottom: 2px solid var(--selected);
      font-weight: 600;
    }

    .word.hit {
      background: rgba(34, 197, 94, 0.25) !important;
      color: #4ade80 !important;
      border-bottom: 2px solid var(--correct) !important;
      text-decoration: line-through;
    }

    .word.missed {
      border: 2px dashed var(--selected) !important;
      color: #fbbf24 !important;
      background: transparent !important;
    }

    .word.false-alarm {
      background: rgba(239, 68, 68, 0.2) !important;
      color: #f87171 !important;
      border-bottom: 2px solid var(--wrong) !important;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }

    .btn-check {
      background: var(--accent);
      color: #0f172a;
    }

    .btn-check:hover {
      background: var(--accent-hover);
    }

    .btn-nav {
      background: #334155;
      color: #fff;
    }

    .btn-nav:hover {
      background: #475569;
    }

    .btn-nav:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .results {
      display: none;
      padding: 18px;
      background: #0b1120;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .results.visible {
      display: block;
    }

    .diff-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.95rem;
    }

    .diff-table th, .diff-table td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }

    .diff-table th {
      color: var(--text-muted);
    }

    .td-wrong {
      color: #f87171;
      text-decoration: line-through;
      font-weight: 600;
    }

    .td-right {
      color: #4ade80;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="nav-header">
      <span class="badge" id="exerciseBadge">Exercise 1 of 10</span>
      <div style="display: flex; gap: 8px;">
        <button id="prevBtn" class="btn-nav" style="padding: 6px 14px; font-size: 0.85rem;" disabled>&larr; Anterior</button>
        <button id="nextBtn" class="btn-nav" style="padding: 6px 14px; font-size: 0.85rem;">Siguiente &rarr;</button>
      </div>
    </div>

    <div class="exercise-grid" id="chipsContainer">
      <span class="grid-label">Ejercicio:</span>
    </div>

    <h1 id="exerciseTitle">Exercise 1: Camping Under the Stars</h1>
    <p class="instr">Escucha el audio con atención. Haz clic sobre las <strong>5 palabras</strong> en el texto que sean diferentes a lo que dicen los hablantes.</p>

    <div class="audio-box">
      <audio id="player" controls></audio>
    </div>

    <div class="counter-bar">
      <span>Palabras seleccionadas:</span>
      <span id="counter" class="counter">0 / 5</span>
    </div>

    <div class="script-box" id="scriptBox"></div>

    <div class="actions">
      <button class="btn-check" id="checkBtn">Verificar respuestas</button>
      <button class="btn-nav" id="resetBtn">Reiniciar intento</button>
    </div>

    <div class="results" id="resultsBox">
      <h3 id="scoreText" style="margin-bottom: 8px;"></h3>
      <table class="diff-table">
        <thead>
          <tr>
            <th>Texto en pantalla</th>
            <th>Lo que dice el audio</th>
          </tr>
        </thead>
        <tbody id="diffBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const EXERCISES = [
      {
        title: "Exercise 1: Camping Under the Stars",
        audioSrc: "audio1.mp3.mp3",
        discrepancies: [
          { screen: "monthly", audio: "yearly" },
          { screen: "five", audio: "three" },
          { screen: "fishing", audio: "hiking" },
          { screen: "moon", audio: "stars" },
          { screen: "snow", audio: "rain" }
        ],
        turns: [
          { speaker: "Paul:", text: "Sarah , I've been looking forward to our {monthly} campout for {five} weeks ." },
          { speaker: "Sarah:", text: "Me too ! It's going to be a wonderful day for {fishing} tomorrow . The great outdoors , camping under the {moon} . This is the life ." },
          { speaker: "Sarah:", text: "Yeah , but Paul , I'm a little bit worried about the weather though . The weatherman said it was going to {snow} later tonight ." }
        ]
      },
      {
        title: "Exercise 2: University Degree",
        audioSrc: "audio2.mp3.mp3",
        discrepancies: [
          { screen: "month", audio: "week" },
          { screen: "miracle", audio: "accomplishment" },
          { screen: "bills", audio: "fees" },
          { screen: "management", audio: "administration" },
          { screen: "marine", audio: "wildlife" }
        ],
        turns: [
          { speaker: "Daughter:", text: "Hey Dad , are you going to miss me when I leave for college next {month} ?" },
          { speaker: "Dad:", text: "Of course I will ! I'll miss you and worry about you . Getting a university degree is a real {miracle} ." },
          { speaker: "Dad:", text: "Did you pay your tuition and housing {bills} by the deadline ?" },
          { speaker: "Dad:", text: "You know , business {management} will be a great major for you ." },
          { speaker: "Daughter:", text: "Dad , I decided to major in {marine} science ." }
        ]
      },
      {
        title: "Exercise 3: Radio Advertising",
        audioSrc: "audio3.mp3.mp3",
        discrepancies: [
          { screen: "cat", audio: "dog" },
          { screen: "tea", audio: "coffee" },
          { screen: "bedroom", audio: "kitchen" },
          { screen: "Super", audio: "Master" },
          { screen: "four", audio: "three" }
        ],
        turns: [
          { speaker: "Carpet:", text: "Hey you ! This is your carpet speaking ! Hello ! Hey ! I take a real beating from you and your family every day ." },
          { speaker: "Carpet:", text: "The kids track mud all over me , the {cat} leaves a bunch of fur balls everywhere ." },
          { speaker: "Carpet:", text: "You spilt {tea} the other day while entertaining guests , and your husband left a trail of potato chip crumbs from the sofa to the {bedroom} last night ." },
          { speaker: "Carpet:", text: "Now pick up that phone and call {Super} Cleaners now ! They'll clean any {four} rooms for 29.95 , and any connecting hall is free ." }
        ]
      },
      {
        title: "Exercise 4: Personal Conflicts",
        audioSrc: "audio4.mp3.mp3",
        discrepancies: [
          { screen: "microwave", audio: "dishwasher" },
          { screen: "plates", audio: "bowls" },
          { screen: "three", audio: "two" },
          { screen: "seven", audio: "six" },
          { screen: "monster", audio: "robot" }
        ],
        turns: [
          { speaker: "Roommate:", text: "Hey Sam , you have a minute ?" },
          { speaker: "Sam:", text: "Sure , unless this is about the great {microwave} mystery again . I don't want to talk about that ." },
          { speaker: "Roommate:", text: "It is not a mystery ! Someone keeps putting dirty {plates} next to the dishwasher and not in it ." },
          { speaker: "Roommate:", text: "It has {three} buttons , Sam !" },
          { speaker: "Sam:", text: "Can we talk about your {seven} AM blender routine ? I woke up thinking the apartment was being attacked by a very angry {monster} ." }
        ]
      },
      {
        title: "Exercise 5: Neighborhood Problems",
        audioSrc: "audio5.mp3.mp3",
        discrepancies: [
          { screen: "screaming", audio: "music" },
          { screen: "concert", audio: "party" },
          { screen: "upstairs", audio: "downstairs" },
          { screen: "mirror", audio: "windshield" },
          { screen: "wide", audio: "tight" }
        ],
        turns: [
          { speaker: "Man:", text: "Hey Claire , did you hear anything strange last night ? I mean , I certainly did ." },
          { speaker: "Claire:", text: "You mean the {screaming} at like 1 AM ? It sounded like someone was testing speakers for a {concert} or something in the apartment below ." },
          { speaker: "Man:", text: "I thought so too , and I almost went {upstairs} , but I didn't want to start a whole neighborhood drama ." },
          { speaker: "Man:", text: "Speaking of problems , did you see the note on my {mirror} ?" },
          { speaker: "Man:", text: "I guess I parked a little crooked , but the spot is {wide} and I'll try to straighten it out next time ." }
        ]
      },
      {
        title: "Exercise 6: Clothing Styles",
        audioSrc: "audio6.mp3.mp3",
        discrepancies: [
          { screen: "shoes", audio: "clothes" },
          { screen: "winter", audio: "summer" },
          { screen: "boots", audio: "sandals" },
          { screen: "October", audio: "November" },
          { screen: "scarf", audio: "hat" }
        ],
        turns: [
          { speaker: "Girl:", text: "Hey Jake , are you ready for your trip ?" },
          { speaker: "Jake:", text: "Well , not really . I still have to buy some {shoes} ." },
          { speaker: "Jake:", text: "It's really hot in the {winter} , so I'm going to buy some shorts , {boots} , and a few t-shirts ." },
          { speaker: "Jake:", text: "People say the fall can still be warm until {October} , so I'm going to buy some jeans and casual shirts ." },
          { speaker: "Jake:", text: "It often snows in the mountains , so I'm going to buy a couple of warm sweaters , a jacket , and a {scarf} ." }
        ]
      },
      {
        title: "Exercise 7: Office Supplies",
        audioSrc: "audio7.mp3.mp3",
        discrepancies: [
          { screen: "morning", audio: "afternoon" },
          { screen: "5:30", audio: "4:30" },
          { screen: "catalog", audio: "brochure" },
          { screen: "desktop", audio: "laptop" },
          { screen: "email", audio: "fax" }
        ],
        turns: [
          { speaker: "Receptionist:", text: "Hello , Ultimate Computers , may I help you ?" },
          { speaker: "Jack:", text: "Yes , this is Jack Kordell . May I speak to Elaine Strong , please ?" },
          { speaker: "Receptionist:", text: "She's not in right now . She should be here later on this {morning} , maybe about {5:30} ." },
          { speaker: "Jack:", text: "Miss Strong sent me a {catalog} detailing your newest line of {desktop} computers , but there wasn't any information about after-sales service ." },
          { speaker: "Receptionist:", text: "Would you like me to {email} that to you ?" }
        ]
      },
      {
        title: "Exercise 8: Shopping for the Day",
        audioSrc: "audio8.mp3.mp3",
        discrepancies: [
          { screen: "Mother's", audio: "Father's" },
          { screen: "watch", audio: "wallet" },
          { screen: "blue", audio: "black" },
          { screen: "twenty", audio: "ten" },
          { screen: "belt", audio: "tie" }
        ],
        turns: [
          { speaker: "Clerk:", text: "Hi young lady , how may I help you ?" },
          { speaker: "Girl:", text: "Well , yeah , I'm looking for a {Mother's} Day gift ." },
          { speaker: "Clerk:", text: "How about getting your father a new {watch} ?" },
          { speaker: "Girl:", text: "How much is that wallet ? The {blue} one ?" },
          { speaker: "Girl:", text: "I don't have that much money . Probably about {twenty} dollars or so ." },
          { speaker: "Clerk:", text: "How about this {belt} ? How about 5 dollars ? What do you say ?" }
        ]
      },
      {
        title: "Exercise 9: Restaurant Order",
        audioSrc: "audio9.mp3.mp3",
        discrepancies: [
          { screen: "here", audio: "go" },
          { screen: "hamburgers", audio: "cheeseburgers" },
          { screen: "basketball", audio: "soccer" },
          { screen: "vanilla", audio: "chocolate" },
          { screen: "dog", audio: "cat" }
        ],
        turns: [
          { speaker: "Cashier:", text: "Hi , is this going to be for here or to go ?" },
          { speaker: "Customer:", text: "To {here} . And yeah , I'd like 80 {hamburgers} ." },
          { speaker: "Customer:", text: "Actually , the food is for a girl's {basketball} team , and the coaches , and some wild fans ." },
          { speaker: "Customer:", text: "I'd like 60 large fries , 13 baked potatoes , 40 {vanilla} shakes , and a glass of water with no ice ." },
          { speaker: "Customer:", text: "It's for our team {dog} ." }
        ]
      },
      {
        title: "Exercise 10: Health Club",
        audioSrc: "audio10.mp3.mp3",
        discrepancies: [
          { screen: "boxes", audio: "weights" },
          { screen: "leg", audio: "back" },
          { screen: "three", audio: "five" },
          { screen: "Texas", audio: "Utah" },
          { screen: "history", audio: "math" }
        ],
        turns: [
          { speaker: "Justin:", text: "Hi , do you need some help with those {boxes} ? I can move them for you ." },
          { speaker: "Justin:", text: "No , let me help you ... Oh , my {leg} !" },
          { speaker: "Rachel:", text: "Are you okay ? Do you come here often ?" },
          { speaker: "Rachel:", text: "Yeah , I usually come {three} times a week . I spent most of my life in a small town in {Texas} called Spanish Fork ." },
          { speaker: "Rachel:", text: "I'm a teacher . I teach {history} and science ." }
        ]
      }
    ];

    let currentIdx = 0;
    let selectedWords = new Set();
    let isChecked = false;

    const player = document.getElementById("player");
    const scriptBox = document.getElementById("scriptBox");
    const counterEl = document.getElementById("counter");
    const checkBtn = document.getElementById("checkBtn");
    const resetBtn = document.getElementById("resetBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const resultsBox = document.getElementById("resultsBox");
    const scoreText = document.getElementById("scoreText");
    const diffBody = document.getElementById("diffBody");
    const exerciseBadge = document.getElementById("exerciseBadge");
    const exerciseTitle = document.getElementById("exerciseTitle");
    const chipsContainer = document.getElementById("chipsContainer");

    function createChips() {
      chipsContainer.innerHTML = '<span class="grid-label">Ejercicio:</span>';
      EXERCISES.forEach((_, i) => {
        const btn = document.createElement("button");
        btn.className = "ex-chip";
        btn.textContent = i + 1;
        btn.title = `Ir al ejercicio ${i + 1}`;
        btn.addEventListener("click", () => loadExercise(i));
        chipsContainer.appendChild(btn);
      });
    }

    function updateActiveChip() {
      const chips = document.querySelectorAll(".ex-chip");
      chips.forEach((c, i) => {
        if (i === currentIdx) c.classList.add("active");
        else c.classList.remove("active");
      });
    }

    function loadExercise(index) {
      currentIdx = index;
      const data = EXERCISES[currentIdx];

      exerciseBadge.textContent = `Exercise ${currentIdx + 1} of ${EXERCISES.length}`;
      exerciseTitle.textContent = data.title;
      player.src = data.audioSrc;
      player.load();

      prevBtn.disabled = currentIdx === 0;
      nextBtn.disabled = currentIdx === EXERCISES.length - 1;

      updateActiveChip();
      resetState();
    }

    function resetState() {
      isChecked = false;
      resultsBox.classList.remove("visible");
      selectedWords.clear();
      updateCounter();
      renderScript();
    }

    function renderScript() {
      scriptBox.innerHTML = "";
      const turns = EXERCISES[currentIdx].turns;

      turns.forEach(turn => {
        const turnDiv = document.createElement("div");
        turnDiv.className = "dialogue-turn";

        const spk = document.createElement("span");
        spk.className = "speaker";
        spk.textContent = turn.speaker + " ";
        turnDiv.appendChild(spk);

        const words = turn.text.split(" ");
        words.forEach(token => {
          if (!token.trim()) return;

          let clean = token;
          let isTarget = false;

          if (token.startsWith("{") && token.endsWith("}")) {
            clean = token.slice(1, -1);
            isTarget = true;
          }

          if ([".", ",", "!", "?"].includes(clean)) {
            turnDiv.appendChild(document.createTextNode(clean + " "));
            return;
          }

          const span = document.createElement("span");
          span.className = "word";
          span.textContent = clean;
          span.dataset.word = clean.toLowerCase();
          if (isTarget) span.dataset.target = "true";

          span.addEventListener("click", () => toggleWord(span));
          turnDiv.appendChild(span);
          turnDiv.appendChild(document.createTextNode(" "));
        });

        scriptBox.appendChild(turnDiv);
      });
    }

    function toggleWord(el) {
      if (isChecked) return;

      if (selectedWords.has(el)) {
        selectedWords.delete(el);
        el.classList.remove("selected");
      } else {
        if (selectedWords.size >= 5) {
          alert("Ya seleccionaste 5 palabras. Haz clic sobre una de las marcadas para deseleccionarla si deseas cambiarla.");
          return;
        }
        selectedWords.add(el);
        el.classList.add("selected");
      }
      updateCounter();
    }

    function updateCounter() {
      const count = selectedWords.size;
      counterEl.textContent = `${count} / 5`;
      if (count === 5) counterEl.classList.add("full");
      else counterEl.classList.remove("full");
    }

    checkBtn.addEventListener("click", () => {
      if (isChecked) return;
      if (selectedWords.size === 0) {
        alert("Selecciona al menos una palabra antes de verificar.");
        return;
      }

      isChecked = true;
      let score = 0;
      const allWords = document.querySelectorAll(".word");

      allWords.forEach(el => {
        const isTarget = el.dataset.target === "true";
        const isSelected = selectedWords.has(el);

        if (isSelected && isTarget) {
          el.className = "word hit";
          score++;
        } else if (isSelected && !isTarget) {
          el.className = "word false-alarm";
        } else if (!isSelected && isTarget) {
          el.className = "word missed";
        }
      });

      resultsBox.classList.add("visible");
      scoreText.innerHTML = `Puntuación: <span style="color: ${score >= 4 ? '#4ade80' : '#f59e0b'}">${score} de 5 aciertos</span>`;
      
      diffBody.innerHTML = "";
      EXERCISES[currentIdx].discrepancies.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td class="td-wrong">${item.screen}</td><td class="td-right">${item.audio}</td>`;
        diffBody.appendChild(tr);
      });
    });

    resetBtn.addEventListener("click", resetState);
    prevBtn.addEventListener("click", () => { if (currentIdx > 0) loadExercise(currentIdx - 1); });
    nextBtn.addEventListener("click", () => { if (currentIdx < EXERCISES.length - 1) loadExercise(currentIdx + 1); });

    createChips();
    loadExercise(0);
  </script>
</body>
</html>
