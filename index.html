<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benchmark Listening Challenge</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --selected: #f59e0b;
      --correct: #22c55e;
      --wrong: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container {
      background: var(--card);
      max-width: 800px;
      width: 100%;
      border-radius: 14px;
      padding: 24px 28px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .badge {
      background: #0284c7;
      color: #fff;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .exercise-grid {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      background: rgba(15, 23, 42, 0.5);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      align-items: center;
    }

    .grid-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-right: 6px;
      font-weight: 600;
    }

    .ex-chip {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #334155;
      color: #fff;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .ex-chip:hover {
      background: #475569;
    }

    .ex-chip.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    h1 {
      font-size: 1.4rem;
      color: var(--accent);
      margin-bottom: 6px;
    }

    p.instr {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .audio-box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    audio {
      width: 100%;
      height: 42px;
      outline: none;
    }

    .counter-bar {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
    }

    .counter {
      color: var(--selected);
      font-weight: 700;
    }

    .counter.full {
      color: var(--correct);
    }

    .script-box {
      background: #0b1120;
      padding: 22px;
      border-radius: 10px;
      border: 1px solid var(--border);
      line-height: 2.3;
      font-size: 1.02rem;
      margin-bottom: 20px;
      user-select: none;
    }

    .dialogue-turn {
      margin-bottom: 12px;
    }

    .speaker {
      font-weight: 700;
      color: var(--accent);
      margin-right: 4px;
    }

    .word {
      display: inline-block;
      padding: 2px 6px;
      margin: 1px 2px;
      border-radius: 6px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: background 0.15s;
    }

    .word:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .word.selected {
      background: rgba(245, 158, 11, 0.25);
      color: #fbbf24;
      border-bottom: 2px solid var(--selected);
      font-weight: 600;
    }

    .word.hit {
      background: rgba(34, 197, 94, 0.25) !important;
      color: #4ade80 !important;
      border-bottom: 2px solid var(--correct) !important;
      text-decoration: line-through;
    }

    .word.missed {
      border: 2px dashed var(--selected) !important;
      color: #fbbf24 !important;
      background: transparent !important;
    }

    .word.false-alarm {
      background: rgba(239, 68, 68, 0.2) !important;
      color: #f87171 !important;
      border-bottom: 2px solid var(--wrong) !important;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }

    .btn-check {
      background: var(--accent);
      color: #0f172a;
    }

    .btn-check:hover {
      background: var(--accent-hover);
    }

    .btn-nav {
      background: #334155;
      color: #fff;
    }

    .btn-nav:hover {
      background: #475569;
    }

    .btn-nav:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .results {
      display: none;
      padding: 18px;
      background: #0b1120;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .results.visible {
      display: block;
    }

    .diff-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.95rem;
    }

    .diff-table th, .diff-table td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }

    .diff-table th {
      color: var(--text-muted);
    }

    .td-wrong {
      color: #f87171;
      text-decoration: line-through;
      font-weight: 600;
    }

    .td-right {
      color: #4ade80;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="nav-header">
      <span class="badge" id="exerciseBadge">Exercise 1 of 10</span>
      <div style="display: flex; gap: 8px;">
        <button id="prevBtn" class="btn-nav" style="padding: 6px 14px; font-size: 0.85rem;" disabled>&larr; Anterior</button>
        <button id="nextBtn" class="btn-nav" style="padding: 6px 14px; font-size: 0.85rem;">Siguiente &rarr;</button>
      </div>
    </div>

    <div class="exercise-grid" id="chipsContainer">
      <span class="grid-label">Ejercicio:</span>
    </div>

    <h1 id="exerciseTitle">Exercise 1: Camping Under the Stars</h1>
    <p class="instr">Escucha el audio con atención. Haz clic sobre las <strong>5 palabras</strong> en el texto que no coincidan con lo que dice la grabación.</p>

    <div class="audio-box">
      <audio id="player" controls></audio>
    </div>

    <div class="counter-bar">
      <span>Palabras seleccionadas:</span>
      <span id="counter" class="counter">0 / 5</span>
    </div>

    <div class="script-box" id="scriptBox"></div>

    <div class="actions">
      <button class="btn-check" id="checkBtn">Verificar respuestas</button>
      <button class="btn-nav" id="resetBtn">Reiniciar intento</button>
    </div>

    <div class="results" id="resultsBox">
      <h3 id="scoreText" style="margin-bottom: 8px;"></h3>
      <table class="diff-table">
        <thead>
          <tr>
            <th>Texto en pantalla</th>
            <th>Lo que dijo el audio</th>
          </tr>
        </thead>
        <tbody id="diffBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const EXERCISES = [
      {
        title: "Exercise 1: Camping Under the Stars",
        audioSrc: "audio1.mp3.mp3",
        discrepancies: [
          { screen: "monthly", audio: "yearly" },
          { screen: "five", audio: "three" },
          { screen: "fishing", audio: "hiking" },
          { screen: "moon", audio: "stars" },
          { screen: "snow", audio: "rain" }
        ],
        turns: [
          { speaker: "Paul:", text: "Sarah , I've been looking forward to our {monthly} campout for {five} weeks ." },
          { speaker: "Sarah:", text: "Me too ! It's going to be a wonderful day for {fishing} tomorrow . The great outdoors , camping under the {moon} . This is the life ." },
          { speaker: "Sarah:", text: "Yeah , but Paul , I'm a little bit worried about the weather though . The weatherman said it was going to {snow} later tonight ." }
        ]
      },
      {
        title: "Exercise 2: University Degree",
        audioSrc: "audio2.mp3.mp3",
        discrepancies: [
          { screen: "brother", audio: "sister" },
          { screen: "Spanish", audio: "French" },
          { screen: "money", audio: "time" },
          { screen: "five", audio: "four" },
          { screen: "easy", audio: "hard" }
        ],
        turns: [
          { speaker: "Man:", text: "So what is your {brother} majoring in at the university ?" },
          { speaker: "Woman:", text: "She decided to study {Spanish} literature and secondary education ." },
          { speaker: "Man:", text: "That sounds like it will take a lot of {money} and effort ." },
          { speaker: "Woman:", text: "Yes , it will probably take her {five} full years , but she is not afraid of {easy} work ." }
        ]
      },
      {
        title: "Exercise 3: Radio Advertising",
        audioSrc: "audio3.mp3.mp3",
        discrepancies: [
          { screen: "expensive", audio: "cheap" },
          { screen: "morning", audio: "afternoon" },
          { screen: "television", audio: "radio" },
          { screen: "listen", audio: "hear" },
          { screen: "Friday", audio: "Monday" }
        ],
        turns: [
          { speaker: "Host:", text: "Are you looking for an {expensive} way to promote your business ?" },
          { speaker: "Host:", text: "Our {morning} show reaches thousands of loyal listeners throughout the county ." },
          { speaker: "Host:", text: "Local {television} advertising is the best way to make people {listen} about your special offers starting this {Friday} ." }
        ]
      },
      {
        title: "Exercise 4: Personal Conflicts",
        audioSrc: "audio4.mp3.mp3",
        discrepancies: [
          { screen: "teacher", audio: "roommate" },
          { screen: "night", audio: "morning" },
          { screen: "doors", audio: "dishes" },
          { screen: "calm", audio: "angry" },
          { screen: "leave", audio: "talk" }
        ],
        turns: [
          { speaker: "Mark:", text: "I really cannot stand my new {teacher} anymore ." },
          { speaker: "Jenny:", text: "Why ? What happened ?" },
          { speaker: "Mark:", text: "He plays loud music every {night} and never cleans the dirty {doors} in the kitchen ." },
          { speaker: "Jenny:", text: "You look really {calm} . You definitely need to {leave} to him directly about house rules ." }
        ]
      },
      {
        title: "Exercise 5: Neighborhood Problems",
        audioSrc: "audio5.mp3.mp3",
        discrepancies: [
          { screen: "cats", audio: "dogs" },
          { screen: "street", audio: "yard" },
          { screen: "three", audio: "two" },
          { screen: "quiet", audio: "noisy" },
          { screen: "call", audio: "visit" }
        ],
        turns: [
          { speaker: "Neighbor 1:", text: "Have you noticed that the {cats} next door keep barking all night long ?" },
          { speaker: "Neighbor 2:", text: "Yes , and they constantly run into our front {street} and dig holes ." },
          { speaker: "Neighbor 1:", text: "This has been happening for at least {three} weeks straight . It is so {quiet} that nobody can sleep ." },
          { speaker: "Neighbor 2:", text: "We should {call} the neighborhood association tomorrow ." }
        ]
      },
      {
        title: "Exercise 6: Clothing Styles",
        audioSrc: "audio6.mp3.mp3",
        discrepancies: [
          { screen: "hat", audio: "jacket" },
          { screen: "blue", audio: "black" },
          { screen: "fifty", audio: "forty" },
          { screen: "cash", audio: "card" },
          { screen: "large", audio: "medium" }
        ],
        turns: [
          { speaker: "Customer:", text: "Excuse me , do you have this leather {hat} in another color ?" },
          { speaker: "Clerk:", text: "We also carry it in classic {blue} and brown ." },
          { speaker: "Customer:", text: "How much is it ? The tag looks like {fifty} dollars ." },
          { speaker: "Clerk:", text: "Yes , and if you pay with {cash} today , you get a discount on any {large} size ." }
        ]
      },
      {
        title: "Exercise 7: Office Supplies",
        audioSrc: "audio7.mp3.mp3",
        discrepancies: [
          { screen: "pens", audio: "paper" },
          { screen: "four", audio: "two" },
          { screen: "closet", audio: "cabinet" },
          { screen: "manager", audio: "boss" },
          { screen: "lunch", audio: "break" }
        ],
        turns: [
          { speaker: "Employee:", text: "Hey , do you know where we keep the extra printer {pens} ?" },
          { speaker: "Colleague:", text: "There should be {four} boxes left in the supply {closet} near the breakroom ." },
          { speaker: "Employee:", text: "Thanks ! The {manager} asked me to prepare these reports right before our {lunch} ." }
        ]
      },
      {
        title: "Exercise 8: Shopping for the Day",
        audioSrc: "audio8.mp3.mp3",
        discrepancies: [
          { screen: "apples", audio: "oranges" },
          { screen: "milk", audio: "bread" },
          { screen: "bag", audio: "list" },
          { screen: "evening", audio: "afternoon" },
          { screen: "bike", audio: "car" }
        ],
        turns: [
          { speaker: "Daughter:", text: "Mom , don't forget to buy fresh {apples} and a carton of {milk} at the supermarket ." },
          { speaker: "Mother:", text: "I wrote everything down on my shopping {bag} so I won't forget ." },
          { speaker: "Mother:", text: "I'll head out this {evening} right after I take the {bike} to the mechanic ." }
        ]
      },
      {
        title: "Exercise 9: Restaurant Order",
        audioSrc: "audio9.mp3.mp3",
        discrepancies: [
          { screen: "steak", audio: "chicken" },
          { screen: "water", audio: "soda" },
          { screen: "soup", audio: "salad" },
          { screen: "ice", audio: "lemon" },
          { screen: "table", audio: "booth" }
        ],
        turns: [
          { speaker: "Server:", text: "Good evening . Are you ready to order or do you need a minute ?" },
          { speaker: "Guest:", text: "I think we are ready . I would like the grilled {steak} with a fresh garden {soup} on the side ." },
          { speaker: "Server:", text: "And for your beverage ?" },
          { speaker: "Guest:", text: "A glass of cold {water} with {ice} , please . We love this corner {table} ." }
        ]
      },
      {
        title: "Exercise 10: Health Club",
        audioSrc: "audio10.mp3",
        discrepancies: [
          { screen: "monthly", audio: "yearly" },
          { screen: "swimming", audio: "running" },
          { screen: "eight", audio: "seven" },
          { screen: "trainer", audio: "instructor" },
          { screen: "shower", audio: "lockers" }
        ],
        turns: [
          { speaker: "Staff:", text: "Welcome to Premier Fitness . Are you interested in our {monthly} membership plan ?" },
          { speaker: "Visitor:", text: "Yes , I am mainly looking to use the {swimming} track and free weights ." },
          { speaker: "Staff:", text: "Our facility opens at {eight} in the morning every weekday . You can also work with a personal {trainer} ." },
          { speaker: "Visitor:", text: "Great , where are the member {shower} located ?" }
        ]
      }
    ];

    let currentIdx = 0;
    let selectedWords = new Set();
    let isChecked = false;

    const player = document.getElementById("player");
    const scriptBox = document.getElementById("scriptBox");
    const counterEl = document.getElementById("counter");
    const checkBtn = document.getElementById("checkBtn");
    const resetBtn = document.getElementById("resetBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const resultsBox = document.getElementById("resultsBox");
    const scoreText = document.getElementById("scoreText");
    const diffBody = document.getElementById("diffBody");
    const exerciseBadge = document.getElementById("exerciseBadge");
    const exerciseTitle = document.getElementById("exerciseTitle");
    const chipsContainer = document.getElementById("chipsContainer");

    function createChips() {
      chipsContainer.innerHTML = '<span class="grid-label">Ejercicio:</span>';
      EXERCISES.forEach((_, i) => {
        const btn = document.createElement("button");
        btn.className = "ex-chip";
        btn.textContent = i + 1;
        btn.title = `Ir al ejercicio ${i + 1}`;
        btn.addEventListener("click", () => loadExercise(i));
        chipsContainer.appendChild(btn);
      });
    }

    function updateActiveChip() {
      const chips = document.querySelectorAll(".ex-chip");
      chips.forEach((c, i) => {
        if (i === currentIdx) c.classList.add("active");
        else c.classList.remove("active");
      });
    }

    function loadExercise(index) {
      currentIdx = index;
      const data = EXERCISES[currentIdx];

      exerciseBadge.textContent = `Exercise ${currentIdx + 1} of ${EXERCISES.length}`;
      exerciseTitle.textContent = data.title;
      player.src = data.audioSrc;
      player.load();

      prevBtn.disabled = currentIdx === 0;
      nextBtn.disabled = currentIdx === EXERCISES.length - 1;

      updateActiveChip();
      resetState();
    }

    function resetState() {
      isChecked = false;
      resultsBox.classList.remove("visible");
      selectedWords.clear();
      updateCounter();
      renderScript();
    }

    function renderScript() {
      scriptBox.innerHTML = "";
      const turns = EXERCISES[currentIdx].turns;

      turns.forEach(turn => {
        const turnDiv = document.createElement("div");
        turnDiv.className = "dialogue-turn";

        const spk = document.createElement("span");
        spk.className = "speaker";
        spk.textContent = turn.speaker + " ";
        turnDiv.appendChild(spk);

        const words = turn.text.split(" ");
        words.forEach(token => {
          if (!token.trim()) return;

          let clean = token;
          let isTarget = false;

          if (token.startsWith("{") && token.endsWith("}")) {
            clean = token.slice(1, -1);
            isTarget = true;
          }

          if ([".", ",", "!", "?"].includes(clean)) {
            turnDiv.appendChild(document.createTextNode(clean + " "));
            return;
          }

          const span = document.createElement("span");
          span.className = "word";
          span.textContent = clean;
          span.dataset.word = clean.toLowerCase();
          if (isTarget) span.dataset.target = "true";

          span.addEventListener("click", () => toggleWord(span));
          turnDiv.appendChild(span);
          turnDiv.appendChild(document.createTextNode(" "));
        });

        scriptBox.appendChild(turnDiv);
      });
    }

    function toggleWord(el) {
      if (isChecked) return;

      if (selectedWords.has(el)) {
        selectedWords.delete(el);
        el.classList.remove("selected");
      } else {
        if (selectedWords.size >= 5) {
          alert("Ya seleccionaste 5 palabras. Haz clic en una para desmarcarla primero si deseas cambiarla.");
          return;
        }
        selectedWords.add(el);
        el.classList.add("selected");
      }
      updateCounter();
    }

    function updateCounter() {
      const count = selectedWords.size;
      counterEl.textContent = `${count} / 5`;
      if (count === 5) counterEl.classList.add("full");
      else counterEl.classList.remove("full");
    }

    checkBtn.addEventListener("click", () => {
      if (isChecked) return;
      if (selectedWords.size === 0) {
        alert("Selecciona al menos una palabra antes de verificar.");
        return;
      }

      isChecked = true;
      let score = 0;
      const allWords = document.querySelectorAll(".word");

      allWords.forEach(el => {
        const isTarget = el.dataset.target === "true";
        const isSelected = selectedWords.has(el);

        if (isSelected && isTarget) {
          el.className = "word hit";
          score++;
        } else if (isSelected && !isTarget) {
          el.className = "word false-alarm";
        } else if (!isSelected && isTarget) {
          el.className = "word missed";
        }
      });

      resultsBox.classList.add("visible");
      scoreText.innerHTML = `Puntuación: <span style="color: ${score >= 4 ? '#4ade80' : '#f59e0b'}">${score} de 5 aciertos</span>`;
      
      diffBody.innerHTML = "";
      EXERCISES[currentIdx].discrepancies.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td class="td-wrong">${item.screen}</td><td class="td-right">${item.audio}</td>`;
        diffBody.appendChild(tr);
      });
    });

    resetBtn.addEventListener("click", resetState);
    prevBtn.addEventListener("click", () => { if (currentIdx > 0) loadExercise(currentIdx - 1); });
    nextBtn.addEventListener("click", () => { if (currentIdx < EXERCISES.length - 1) loadExercise(currentIdx + 1); });

    createChips();
    loadExercise(0);
  </script>
</body>
</html>
